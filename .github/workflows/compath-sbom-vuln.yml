# compath — SBOM 생성 · 취약점 스캔
#
# 이 저장소는 베어메탈 STM32 펌웨어라 lockfile 이 없다. 대신 firmware/Makefile 이 컴파일하는
# 벤더 트리(Drivers/, Middlewares/Third_Party/)와 그 버전 핀이 곧 의존성 선언이며, BeyondCDX 가
# 그 파일을 그대로 읽어 SBOM 을 만든다.
#
# 파이프라인이 하는 일:
#   1. BeyondCDX → sbom.xlsx (사람이 읽는 제출용) + sbom.cdx.json (스캐너가 읽는 것)
#   2. grype 로 그 SBOM 을 스캔 — CPE 로 매칭되므로 레지스트리가 없는 컴포넌트도 CVE 가 잡힌다
#   3. 결과를 VulnGuard 연동에 적재 → FDA 위험산정(KEV/EPSS/CVSS) + NIST 800-40 대응까지 자동
#
# 코드 취약점(semgrep · cppcheck · gitleaks)은 여기서 돌리지 않는다. VulnGuard 연동이 push 를
# 받아 자기 클러스터에서 돌린다 — 같은 스캐너를 두 곳에서 돌리면 결과가 두 벌이 된다.

name: compath — SBOM · 취약점

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: SBOM 생성 및 취약점 스캔
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: compath 액세스 토큰 발급
        id: token
        env:
          CLIENT_ID: ${{ secrets.COMPATH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.COMPATH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          TOKEN=$(curl -sf -X POST \
            https://auth.special-partners.com/realms/compath/protocol/openid-connect/token \
            -d grant_type=client_credentials \
            -d client_id="$CLIENT_ID" \
            -d client_secret="$CLIENT_SECRET" | jq -er .access_token)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      # 한 번 분석해서 두 형식으로 받는다. 요청 하나가 문서 하나를 돌려주므로 두 번 호출한다.
      - name: SBOM 생성 (BeyondCDX)
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          BASE: https://compath.special-partners.com/api/apps/beyond-cdx/proxy/ci/analyze
        run: |
          set -euo pipefail
          for fmt in xlsx cdx; do
            case "$fmt" in
              xlsx) out=sbom.xlsx ;;
              cdx)  out=sbom.cdx.json ;;
            esac
            echo "::group::$out"
            curl -sS --fail-with-body \
              -X POST "${BASE}?filename=Makefile&format=${fmt}&subject=${GITHUB_REPOSITORY##*/}" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @firmware/Makefile \
              -D "headers-${fmt}.txt" -o "$out"
            grep -i '^X-BeyondCDX' "headers-${fmt}.txt" || true
            echo "::endgroup::"
          done

          # 상한을 넘겨 잘렸다면 빌드를 실패시킨다 — 조용한 부분 SBOM 은 없는 것보다 나쁘다.
          if grep -qi '^X-BeyondCDX-Truncated:' headers-cdx.txt; then
            echo "::error::의존성이 분석 상한을 초과했습니다"; exit 1
          fi

          echo "### SBOM" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"컴포넌트 \(.components|length)개\n",
                 (.components[] | "- \(.name) \(.version // "(버전 미상)") — \(.cpe // "CPE 없음")")' \
            sbom.cdx.json >> "$GITHUB_STEP_SUMMARY"

      - name: SBOM 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.xlsx
            sbom.cdx.json
          if-no-files-found: error

      - name: grype 설치
        run: |
          set -euo pipefail
          curl -sSfL https://get.anchore.io/grype | sh -s -- -b /usr/local/bin

      # SBOM 취약점. CPE 로 매칭되므로 pkg:generic 컴포넌트(=이 펌웨어의 전부)도 CVE 가 나온다.
      # 발견이 있어도 여기서 빌드를 깨지 않는다 — 무엇을 고칠지는 VulnGuard 에서 위험도로 판단한다.
      - name: SBOM 취약점 스캔 (grype)
        run: |
          set -euo pipefail
          grype "sbom:sbom.cdx.json" -o json --quiet > grype.json || true
          COUNT=$(jq '.matches | length' grype.json)
          echo "grype 매치: $COUNT"
          {
            echo "### SBOM 취약점 — $COUNT 건"
            jq -r '.matches[] | "- \(.vulnerability.id) · \(.vulnerability.severity) · \(.artifact.name) \(.artifact.version)"' \
              grype.json | sort -u
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 스캔 결과 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: vuln-scan
          path: grype.json

      # 결과를 VulnGuard 연동으로 보낸다. 인증은 연동 시크릿 HMAC 이다 — CI 러너에 compath
      # 세션을 주지 않기 위해서이고, 이 시크릿은 이 연동 하나에만 쓸 수 있다.
      #
      # kinds:["sca"] 가 중요하다. VulnGuard 는 스캔이 보고하지 않은 항목을 해결됨으로 보는데,
      # 그 판정은 실제로 돌린 종류 안에서만 옳다. 이 워크플로는 SBOM 만 보므로 sca 만 선언한다 —
      # 안 그러면 클러스터 쪽 Job 이 찾아둔 코드 취약점을 전부 조용히 닫아버린다.
      - name: VulnGuard 로 결과 전송
        if: github.event_name != 'pull_request'
        env:
          CONNECTION_ID: ${{ secrets.VULNGUARD_CONNECTION_ID }}
          HOOK_SECRET: ${{ secrets.VULNGUARD_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CONNECTION_ID:-}" ] || [ -z "${HOOK_SECRET:-}" ]; then
            echo "::warning::VULNGUARD_* 시크릿이 없어 전송을 건너뜁니다"
            exit 0
          fi

          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --rawfile grype grype.json \
            '{ commit: $commit, ref: $ref, status: "succeeded", kinds: ["sca"],
               findings: { raw: [ { tool: "grype", format: "grype", content: $grype } ] } }' \
            > payload.json

          SIG=$(openssl dgst -sha256 -hmac "$HOOK_SECRET" -hex < payload.json | awk '{print $NF}')

          curl -sS --fail-with-body \
            -X POST "https://compath.special-partners.com/hooks/vuln-manager/${CONNECTION_ID}/ci" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=${SIG}" \
            --data-binary @payload.json
          echo
